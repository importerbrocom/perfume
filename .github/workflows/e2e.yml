name: E2E (WordPress + WooCommerce in Docker)
on:
  workflow_dispatch:
  pull_request:
    paths: ['wp-content/**','dev/**','tests/**','.github/workflows/e2e.yml']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Start WordPress + WooCommerce (test passwords are throwaway)
        working-directory: dev
        run: |
          printf 'DB_PASSWORD=ci-db\nDB_ROOT_PASSWORD=ci-root\nADMIN_PASSWORD=ci-admin-Pass1!\n' > .env
          docker compose up -d db wordpress
          ./setup.sh
          docker compose run --rm -T wpcli eval-file /seed-staging.php
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 npx playwright test
      - name: No PHP errors/warnings from the plugin
        if: always()
        working-directory: dev
        run: |
          docker compose logs wordpress > wp.log 2>&1 || true
          if grep -iE "PHP (Fatal|Parse|Warning|Notice|Deprecated).*perfumarathi-shop" wp.log; then echo "Plugin produced PHP errors"; exit 1; fi
          echo "No plugin PHP errors in server log"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: tests/e2e/test-results }
