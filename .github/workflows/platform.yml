name: Platform (Laravel API + React shop)
on:
  workflow_dispatch:
  pull_request:
    paths: ['platform/**', 'server/export-wp.php', '.github/workflows/platform.yml']
  push:
    branches: [main]
    paths: ['platform/**']
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, mariadb]
    services:
      mysql:
        image: ${{ matrix.db == 'mariadb' && 'mariadb:10.11' || 'mysql:8.0' }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MARIADB_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: pmshop
          MARIADB_DATABASE: pmshop
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root || mariadb-admin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: platform/backend
    env:
      DB_CONNECTION: ${{ matrix.db == 'sqlite' && 'sqlite' || (matrix.db == 'mariadb' && 'mariadb' || 'mysql') }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'pmshop' }}
      DB_USERNAME: root
      DB_PASSWORD: ci-root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, intl, bcmath, curl, zip
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Tests
        # phpunit.xml only fills in env vars that are not set, so the job's DB_* settings pick the database.
        run: php artisan test
      - name: Migrations run on a real server database and can roll back
        if: matrix.db != 'sqlite'
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan db:seed --force   # seeding twice must be safe
          php artisan migrate:rollback --force
          php artisan migrate --force --seed
      - name: Concurrent checkouts never oversell
        if: matrix.db != 'sqlite'
        run: |
          php artisan migrate:fresh --seed --force
          # Laravel's router file serves from the current folder, so start it inside public/ (8 parallel PHP workers).
          (cd public && PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8099 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > /tmp/server.log 2>&1 &)
          sleep 2
          php tests/ci/concurrency.php http://127.0.0.1:8099 || { tail -50 storage/logs/laravel.log 2>/dev/null; exit 1; }
      - name: Code style (Pint)
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test

  shop:
    name: React shop (unit + browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, intl, bcmath, curl, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          (cd ../backend && composer install --no-interaction --no-progress --prefer-dist)
      - name: Unit tests
        run: npm test
      - name: Build (into the Laravel app)
        run: |
          npm run build
          test -f ../backend/resources/spa/index.html
          ls ../backend/public/assets/*.js
      - name: Browser tests (desktop + phone, against Laravel)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Server log on failure
        if: failure()
        working-directory: platform/backend
        run: tail -100 storage/logs/laravel.log storage/logs/e2e-server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: platform/frontend/playwright-report
          retention-days: 7
