name: cPanel staging installer
on:
  workflow_dispatch:
  pull_request:
    paths: ['server/**','wp-content/**','H.HTML','dev/seed-staging.php','.github/workflows/staging-script.yml']
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBP: ci-Perfume-db-1   # throwaway CI-only password
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: mysqli, tools: none }
      - name: Fake cPanel home (MySQL db + user, empty domain folder, a "live" folder)
        run: |
          sudo systemctl start mysql
          sudo mysql -uroot -proot -e "CREATE DATABASE uddjzwrz_perfume; CREATE USER 'uddjzwrz_perfume'@'localhost' IDENTIFIED BY '$DBP'; GRANT ALL ON uddjzwrz_perfume.* TO 'uddjzwrz_perfume'@'localhost';"
          mkdir -p "$HOME/perfume.nokkoo.in/.well-known" "$HOME/perfumarathi.com"
          printf "memory_limit=256M\n" > "$HOME/perfume.nokkoo.in/php.ini"; cp "$HOME/perfume.nokkoo.in/php.ini" "$HOME/perfume.nokkoo.in/.user.ini"
          echo "LIVE" > "$HOME/perfumarathi.com/index.php"
          # Like the real server: a system `wp` that gets killed on every call. The installer must not use it.
          printf '#!/bin/bash\nkill -9 $$\n' | sudo tee /usr/local/bin/wp >/dev/null && sudo chmod +x /usr/local/bin/wp
          if wp --info; then echo "fake wp should be killed"; exit 1; fi
      - name: Refuses to run against the live site folder
        run: |
          if printf '%s\nx@example.test\n' "$DBP" | DOCROOT="$HOME/perfumarathi.com" bash server/install-staging.sh; then echo "should have refused"; exit 1; fi
          test "$(cat "$HOME/perfumarathi.com/index.php")" = "LIVE"
          test "$(ls -A "$HOME/perfumarathi.com")" = "index.php"
      - name: Refuses a wrong database password and leaves the folder clean
        run: |
          if printf 'wrong-pass\nx@example.test\n' | bash server/install-staging.sh; then echo "should have failed"; exit 1; fi
          test "$(ls -A "$HOME/perfume.nokkoo.in" | sort | tr "\n" " ")" = ".user.ini .well-known php.ini "
      - name: A killed WP-CLI gives a clear message and leaves the folder clean
        run: |
          REAL=$(command -v php)
          mkdir -p /tmp/killphp
          printf '#!/bin/bash\nfor a in "$@"; do [ "$a" = create ] && kill -9 $$; done\nexec %s "$@"\n' "$REAL" > /tmp/killphp/php && chmod +x /tmp/killphp/php
          if printf '%s\nx@example.test\n' "$DBP" | PHP_BIN=/tmp/killphp/php bash server/install-staging.sh 2>/tmp/kill.err; then echo "should have stopped"; exit 1; fi
          cat /tmp/kill.err
          grep -q "the server killed WP-CLI" /tmp/kill.err
          if grep -q "Check the password" /tmp/kill.err; then echo "misleading password message"; exit 1; fi
          test "$(ls -A "$HOME/perfume.nokkoo.in" | sort | tr "\n" " ")" = ".user.ini .well-known php.ini "
      - name: Install staging
        # Approximate a shared-hosting memory cap (address-space limit for the installer and its children).
        run: |
          set -o pipefail
          # stderr included: the database password must not appear anywhere in the terminal output.
          printf '%s\nstaging-inbox@example.test\n' "$DBP" | (ulimit -v 3000000; bash server/install-staging.sh 2>&1) | tee /tmp/install.log
      - name: Refuses to run twice (folder not empty)
        run: |
          if printf '%s\nx@example.test\n' "$DBP" | bash server/install-staging.sh; then echo "should have refused"; exit 1; fi
      - name: Refuses a database that already has tables
        run: |
          mkdir -p "$HOME/second"
          if printf '%s\nx@example.test\n' "$DBP" | DOCROOT="$HOME/second" bash server/install-staging.sh; then echo "should have refused"; exit 1; fi
          test -z "$(ls -A "$HOME/second")"
          test -z "$(ls -d "$HOME"/.pm-staging-* 2>/dev/null)"   # temp folders cleaned up
      - name: Verify the installed staging site
        run: |
          W="php $HOME/.wp-cli/pm-staging-wp-cli.phar --path=$HOME/perfume.nokkoo.in"
          $W eval-file - <<'PHP'
          <?php
          $fail = function ( $m ) { WP_CLI::error( $m ); };
          if ( 'staging' !== wp_get_environment_type() ) $fail( 'environment not staging' );
          if ( 'pmstg_' !== $GLOBALS['wpdb']->prefix ) $fail( 'prefix' );
          if ( 'https://perfume.nokkoo.in' !== home_url() ) $fail( 'home url ' . home_url() );
          if ( '0' !== (string) get_option( 'blog_public' ) ) $fail( 'indexable' );
          foreach ( array( 'woocommerce/woocommerce.php', 'perfumarathi-shop/perfumarathi-shop.php' ) as $p ) if ( ! is_plugin_active( $p ) ) $fail( "$p inactive" );
          if ( ! function_exists( 'pm_gate_token' ) ) $fail( 'staging guard mu-plugin not loaded' );
          if ( strlen( (string) get_option( 'pm_staging_gate_key' ) ) < 20 ) $fail( 'gate key' );
          if ( 'no' !== get_option( 'woocommerce_coming_soon' ) ) $fail( 'coming soon on' );
          $n = (int) wp_count_posts( 'product' )->publish; if ( 2 !== $n ) $fail( "expected 2 [TEST] products, got $n" );
          foreach ( array( 'shop-perfumarathi', 'shop-fixnote', 'track-order', 'wishlist', 'staging-home' ) as $slug ) if ( ! get_page_by_path( $slug ) ) $fail( "page $slug" );
          if ( ! term_exists( 'perfumarathi', 'pm_brand' ) || ! term_exists( 'fixnote', 'pm_brand' ) ) $fail( 'brands' );
          // Mail redirect: real recipient + CC replaced by the staging inbox.
          $m = apply_filters( 'wp_mail', array( 'to' => 'customer@example.com', 'subject' => 'Your order', 'message' => 'x', 'headers' => "Cc: boss@example.com\r\nContent-Type: text/html", 'attachments' => array() ) );
          if ( 'staging-inbox@example.test' !== $m['to'] ) $fail( 'mail not redirected: ' . $m['to'] );
          if ( false === strpos( $m['subject'], '[STAGING to customer@example.com]' ) ) $fail( 'subject marker' );
          if ( preg_grep( '/^\s*cc:/i', $m['headers'] ) ) $fail( 'CC kept' );
          // Cloudflare client IP: trusted only from Cloudflare ranges.
          $_SERVER['HTTP_CF_CONNECTING_IP'] = '203.0.113.9';
          $_SERVER['REMOTE_ADDR'] = '172.70.1.2';           if ( '203.0.113.9' !== PM_REST::client_ip() ) $fail( 'CF v4 not trusted' );
          $_SERVER['REMOTE_ADDR'] = '2a06:98c1::5';         if ( '203.0.113.9' !== PM_REST::client_ip() ) $fail( 'CF v6 not trusted' );
          $_SERVER['REMOTE_ADDR'] = '198.51.100.7';         if ( '198.51.100.7' !== PM_REST::client_ip() ) $fail( 'spoofed header trusted' );
          $_SERVER['REMOTE_ADDR'] = '172.80.0.1';           if ( '172.80.0.1' !== PM_REST::client_ip() ) $fail( 'outside /13 trusted' );
          $_SERVER['HTTP_CF_CONNECTING_IP'] = 'not-an-ip'; $_SERVER['REMOTE_ADDR'] = '172.70.1.2';
          if ( '172.70.1.2' !== PM_REST::client_ip() ) $fail( 'invalid header accepted' );
          WP_CLI::success( 'Staging install verified' );
          PHP
      - name: Verify the staging gate over HTTP
        run: |
          KEY=$(grep -oE 'Staging key \(visitors\):\s+[0-9a-f]+' /tmp/install.log | awk '{print $NF}')
          test -n "$KEY"
          cat > /tmp/router.php <<'PHP'
          <?php
          $f = $_SERVER['DOCUMENT_ROOT'] . parse_url( $_SERVER['REQUEST_URI'], PHP_URL_PATH );
          if ( is_file( $f ) ) { return false; }
          require $_SERVER['DOCUMENT_ROOT'] . '/index.php';
          PHP
          php -S 127.0.0.1:8090 -t "$HOME/perfume.nokkoo.in" /tmp/router.php >/tmp/php.log 2>&1 &
          sleep 2
          H=(-H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https')
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" http://127.0.0.1:8090/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" http://127.0.0.1:8090/wp-json/pm/v1/products)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: wrong" http://127.0.0.1:8090/)" = 401
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: $KEY" http://127.0.0.1:8090/)
          test "$code" = 200 && grep -q 'pm-home' /tmp/home.html && grep -q 'noindex' /tmp/home.html
          curl -s "${H[@]}" -H "X-PM-Gate: $KEY" "http://127.0.0.1:8090/wp-json/pm/v1/products?brand=fixnote" | grep -q '\[TEST\] Fixnote'
          if grep -iE "PHP (Fatal|Parse|Warning|Notice|Deprecated).*(perfumarathi-shop|pm-staging-guard)" /tmp/php.log; then exit 1; fi
          echo "Gate verified"
      - name: Secrets were not written to disk outside wp-config.php
        run: |
          grep -rl --exclude=wp-config.php "$DBP" "$HOME/perfume.nokkoo.in" && { echo "DB password leaked into files"; exit 1; } || true
          test "$(stat -c %a "$HOME/perfume.nokkoo.in/wp-config.php")" = 600
          if grep -q "$DBP" /tmp/install.log; then echo "password printed in output"; exit 1; fi
      - name: Brand homepage setup (refuses non-staging, then live design + shop on the homepage)
        run: |
          D="$HOME/perfume.nokkoo.in"
          if DOCROOT=/tmp DOCROOT_NOTE=x bash server/setup-brand-home.sh; then echo "should refuse non-staging"; exit 1; fi
          # Stand-in for the three public media files (CI never contacts the live site).
          mkdir -p /tmp/assets && cd /tmp/assets
          printf '\x89PNG\r\n\x1a\nfake' > IMG_2610.png; printf '\xff\xd8\xff fake' > IMG_2609.jpg; head -c 4096 /dev/urandom > IMG_2654.mp4
          php -S 127.0.0.1:8095 -t /tmp/assets >/tmp/assets.log 2>&1 &
          sleep 1; cd "$GITHUB_WORKSPACE"
          PM_ASSET_SRC=http://127.0.0.1:8095 bash server/setup-brand-home.sh | tee /tmp/brand.log
          PM_ASSET_SRC=http://127.0.0.1:8095 bash server/setup-brand-home.sh >/dev/null   # idempotent second run
          for f in IMG_2610.png IMG_2609.jpg IMG_2654.mp4; do test -s "$D/wp-content/uploads/pm-brand/$f"; done
          test ! -e "$D/wp-content/plugins/perfumarathi-shop.old" && test ! -e "$D/wp-content/plugins/perfumarathi-shop.new"
          KEY=$(grep -oE 'Staging key \(visitors\):\s+[0-9a-f]+' /tmp/install.log | awk '{print $NF}')
          php -S 127.0.0.1:8092 -t "$D" /tmp/router.php >/tmp/php3.log 2>&1 &
          sleep 2
          curl -s -H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https' -H "X-PM-Gate: $KEY" http://127.0.0.1:8092/ > /tmp/front.html
          for want in 'id="pf-brand-home"' 'THE ART OF FRAGRANCE' 'uploads/pm-brand/IMG_2654.mp4' 'uploads/pm-brand/IMG_2610.png' \
                      'uploads/pm-brand/IMG_2609.jpg' 'ENTER PERFUMARATHI' 'SHOP FIXNOTE' '/shop-perfumarathi/' '/shop-fixnote/' \
                      'class="pm-home"' 'data-pm-rail' 'FOLLOW PERFUMARATHI' 'wa.me/971528209716' 'data-pm-open-cart' 'pm-canvas' 'noindex'; do
            grep -qF "$want" /tmp/front.html || { echo "missing on homepage: $want"; exit 1; }
          done
          # Social section must come AFTER the shop sections, and no theme header/footer (canvas template).
          a=$(grep -bo 'class="pm-home"' /tmp/front.html | head -1 | cut -d: -f1); b=$(grep -bo 'FOLLOW PERFUMARATHI' /tmp/front.html | cut -d: -f1)
          test "$a" -lt "$b"
          if grep -q 'wp-site-blocks' /tmp/front.html; then echo "theme header/footer rendered"; exit 1; fi
          if grep -q 'perfumarathi.com/?page_id' /tmp/front.html; then echo "links point at live site"; exit 1; fi
          if grep -iE "PHP (Fatal|Parse|Warning|Notice|Deprecated).*(perfumarathi-shop|pm-staging-guard)" /tmp/php3.log; then exit 1; fi
          echo "Brand homepage verified"
      - name: Rotate secrets (wrong DB password refused, then new key, admin password and DB password)
        run: |
          set -o pipefail
          D="$HOME/perfume.nokkoo.in"
          OLDKEY=$(grep -oE 'Staging key \(visitors\):\s+[0-9a-f]+' /tmp/install.log | awk '{print $NF}')
          NEWDB='ci-New-db-2'
          sudo mysql -uroot -proot -e "ALTER USER 'uddjzwrz_perfume'@'localhost' IDENTIFIED BY '$NEWDB';"
          cp "$D/wp-config.php" /tmp/cfg.before
          if printf 'y\nnot-the-password\n' | bash server/rotate-staging-secrets.sh; then echo "should refuse"; exit 1; fi
          cmp "$D/wp-config.php" /tmp/cfg.before
          printf 'y\n%s\n' "$NEWDB" | bash server/rotate-staging-secrets.sh 2>&1 | tee /tmp/rotate.log
          if grep -q "$NEWDB" /tmp/rotate.log; then echo "DB password printed"; exit 1; fi
          grep -q "define( 'DB_PASSWORD', '$NEWDB' );" "$D/wp-config.php"
          test "$(stat -c %a "$D/wp-config.php")" = 600
          test ! -e "$D/wp-config.php.bak"
          NEWKEY=$(grep -oE 'New staging key \(visitors\):\s+[0-9a-f]+' /tmp/rotate.log | awk '{print $NF}')
          NEWADMIN=$(grep -oE 'New admin password \(pmadmin\):\s+\S+' /tmp/rotate.log | awk '{print $NF}')
          test -n "$NEWKEY" && test "$NEWKEY" != "$OLDKEY" && test -n "$NEWADMIN"
          php "$HOME/.wp-cli/pm-staging-wp-cli.phar" --path="$D" eval "exit( wp_check_password( '$NEWADMIN', get_user_by( 'login', 'pmadmin' )->user_pass ) ? 0 : 1 );"
          php -S 127.0.0.1:8091 -t "$D" /tmp/router.php >/tmp/php2.log 2>&1 &
          sleep 2
          H=(-H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https')
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: $OLDKEY" http://127.0.0.1:8091/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: $NEWKEY" http://127.0.0.1:8091/)" = 200
          # Refuses a folder that is not the staging site
          mkdir -p /tmp/notstaging && echo "<?php define( 'DB_PASSWORD', 'x' );" > /tmp/notstaging/wp-config.php
          if printf 'n\n' | DOCROOT=/tmp/notstaging bash server/rotate-staging-secrets.sh; then echo "should refuse"; exit 1; fi
          echo "Rotation verified"
