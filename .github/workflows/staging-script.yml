name: cPanel staging installer
on:
  workflow_dispatch:
  pull_request:
    paths: ['server/**','wp-content/**','H.HTML','dev/seed-staging.php','.github/workflows/staging-script.yml']
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBP: ci-Perfume-db-1   # throwaway CI-only password
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'mysqli, gd', tools: none }
      - name: Fake cPanel home (MySQL db + user, empty domain folder, a "live" folder)
        run: |
          sudo systemctl start mysql
          sudo mysql -uroot -proot -e "CREATE DATABASE uddjzwrz_perfume; CREATE USER 'uddjzwrz_perfume'@'localhost' IDENTIFIED BY '$DBP'; GRANT ALL ON uddjzwrz_perfume.* TO 'uddjzwrz_perfume'@'localhost';"
          mkdir -p "$HOME/perfume.nokkoo.in/.well-known" "$HOME/perfumarathi.com"
          printf "memory_limit=256M\n" > "$HOME/perfume.nokkoo.in/php.ini"; cp "$HOME/perfume.nokkoo.in/php.ini" "$HOME/perfume.nokkoo.in/.user.ini"
          echo "LIVE" > "$HOME/perfumarathi.com/index.php"
          # Like the real server: a system `wp` that gets killed on every call. The installer must not use it.
          printf '#!/bin/bash\nkill -9 $$\n' | sudo tee /usr/local/bin/wp >/dev/null && sudo chmod +x /usr/local/bin/wp
          if wp --info; then echo "fake wp should be killed"; exit 1; fi
      - name: Refuses to run against the live site folder
        run: |
          if printf '%s\nx@example.test\n' "$DBP" | DOCROOT="$HOME/perfumarathi.com" bash server/install-staging.sh; then echo "should have refused"; exit 1; fi
          test "$(cat "$HOME/perfumarathi.com/index.php")" = "LIVE"
          test "$(ls -A "$HOME/perfumarathi.com")" = "index.php"
      - name: Refuses a wrong database password and leaves the folder clean
        run: |
          if printf 'wrong-pass\nx@example.test\n' | bash server/install-staging.sh; then echo "should have failed"; exit 1; fi
          test "$(ls -A "$HOME/perfume.nokkoo.in" | sort | tr "\n" " ")" = ".user.ini .well-known php.ini "
      - name: A killed WP-CLI gives a clear message and leaves the folder clean
        run: |
          REAL=$(command -v php)
          mkdir -p /tmp/killphp
          printf '#!/bin/bash\nfor a in "$@"; do [ "$a" = create ] && kill -9 $$; done\nexec %s "$@"\n' "$REAL" > /tmp/killphp/php && chmod +x /tmp/killphp/php
          if printf '%s\nx@example.test\n' "$DBP" | PHP_BIN=/tmp/killphp/php bash server/install-staging.sh 2>/tmp/kill.err; then echo "should have stopped"; exit 1; fi
          cat /tmp/kill.err
          grep -q "the server killed WP-CLI" /tmp/kill.err
          if grep -q "Check the password" /tmp/kill.err; then echo "misleading password message"; exit 1; fi
          test "$(ls -A "$HOME/perfume.nokkoo.in" | sort | tr "\n" " ")" = ".user.ini .well-known php.ini "
      - name: Install staging
        # Approximate a shared-hosting memory cap (address-space limit for the installer and its children).
        run: |
          set -o pipefail
          # stderr included: the database password must not appear anywhere in the terminal output.
          printf '%s\nstaging-inbox@example.test\n' "$DBP" | (ulimit -v 3000000; bash server/install-staging.sh 2>&1) | tee /tmp/install.log
      - name: Refuses to run twice (folder not empty)
        run: |
          if printf '%s\nx@example.test\n' "$DBP" | bash server/install-staging.sh; then echo "should have refused"; exit 1; fi
      - name: Refuses a database that already has tables
        run: |
          mkdir -p "$HOME/second"
          if printf '%s\nx@example.test\n' "$DBP" | DOCROOT="$HOME/second" bash server/install-staging.sh; then echo "should have refused"; exit 1; fi
          test -z "$(ls -A "$HOME/second")"
          test -z "$(ls -d "$HOME"/.pm-staging-* 2>/dev/null)"   # temp folders cleaned up
      - name: Verify the installed staging site
        run: |
          W="php $HOME/.wp-cli/pm-staging-wp-cli.phar --path=$HOME/perfume.nokkoo.in"
          $W eval-file - <<'PHP'
          <?php
          $fail = function ( $m ) { WP_CLI::error( $m ); };
          if ( 'staging' !== wp_get_environment_type() ) $fail( 'environment not staging' );
          if ( 'pmstg_' !== $GLOBALS['wpdb']->prefix ) $fail( 'prefix' );
          if ( 'https://perfume.nokkoo.in' !== home_url() ) $fail( 'home url ' . home_url() );
          if ( '0' !== (string) get_option( 'blog_public' ) ) $fail( 'indexable' );
          foreach ( array( 'woocommerce/woocommerce.php', 'perfumarathi-shop/perfumarathi-shop.php' ) as $p ) if ( ! is_plugin_active( $p ) ) $fail( "$p inactive" );
          if ( ! function_exists( 'pm_gate_token' ) ) $fail( 'staging guard mu-plugin not loaded' );
          if ( strlen( (string) get_option( 'pm_staging_gate_key' ) ) < 20 ) $fail( 'gate key' );
          if ( 'no' !== get_option( 'woocommerce_coming_soon' ) ) $fail( 'coming soon on' );
          $n = (int) wp_count_posts( 'product' )->publish; if ( 2 !== $n ) $fail( "expected 2 [TEST] products, got $n" );
          foreach ( array( 'shop-perfumarathi', 'shop-fixnote', 'track-order', 'wishlist', 'staging-home' ) as $slug ) if ( ! get_page_by_path( $slug ) ) $fail( "page $slug" );
          if ( ! term_exists( 'perfumarathi', 'pm_brand' ) || ! term_exists( 'fixnote', 'pm_brand' ) ) $fail( 'brands' );
          // Mail redirect: real recipient + CC replaced by the staging inbox.
          $m = apply_filters( 'wp_mail', array( 'to' => 'customer@example.com', 'subject' => 'Your order', 'message' => 'x', 'headers' => "Cc: boss@example.com\r\nContent-Type: text/html", 'attachments' => array() ) );
          if ( 'staging-inbox@example.test' !== $m['to'] ) $fail( 'mail not redirected: ' . $m['to'] );
          if ( false === strpos( $m['subject'], '[STAGING to customer@example.com]' ) ) $fail( 'subject marker' );
          if ( preg_grep( '/^\s*cc:/i', $m['headers'] ) ) $fail( 'CC kept' );
          // Cloudflare client IP: trusted only from Cloudflare ranges.
          $_SERVER['HTTP_CF_CONNECTING_IP'] = '203.0.113.9';
          $_SERVER['REMOTE_ADDR'] = '172.70.1.2';           if ( '203.0.113.9' !== PM_REST::client_ip() ) $fail( 'CF v4 not trusted' );
          $_SERVER['REMOTE_ADDR'] = '2a06:98c1::5';         if ( '203.0.113.9' !== PM_REST::client_ip() ) $fail( 'CF v6 not trusted' );
          $_SERVER['REMOTE_ADDR'] = '198.51.100.7';         if ( '198.51.100.7' !== PM_REST::client_ip() ) $fail( 'spoofed header trusted' );
          $_SERVER['REMOTE_ADDR'] = '172.80.0.1';           if ( '172.80.0.1' !== PM_REST::client_ip() ) $fail( 'outside /13 trusted' );
          $_SERVER['HTTP_CF_CONNECTING_IP'] = 'not-an-ip'; $_SERVER['REMOTE_ADDR'] = '172.70.1.2';
          if ( '172.70.1.2' !== PM_REST::client_ip() ) $fail( 'invalid header accepted' );
          WP_CLI::success( 'Staging install verified' );
          PHP
      - name: Verify the staging gate over HTTP
        run: |
          KEY=$(grep -oE 'Staging key \(visitors\):\s+[0-9a-f]+' /tmp/install.log | awk '{print $NF}')
          test -n "$KEY"
          cat > /tmp/router.php <<'PHP'
          <?php
          $f = $_SERVER['DOCUMENT_ROOT'] . parse_url( $_SERVER['REQUEST_URI'], PHP_URL_PATH );
          if ( is_file( $f ) ) { return false; }
          require $_SERVER['DOCUMENT_ROOT'] . '/index.php';
          PHP
          php -S 127.0.0.1:8090 -t "$HOME/perfume.nokkoo.in" /tmp/router.php >/tmp/php.log 2>&1 &
          sleep 2
          H=(-H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https')
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" http://127.0.0.1:8090/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" http://127.0.0.1:8090/wp-json/pm/v1/products)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: wrong" http://127.0.0.1:8090/)" = 401
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: $KEY" http://127.0.0.1:8090/)
          test "$code" = 200 && grep -q 'pm-home' /tmp/home.html && grep -q 'noindex' /tmp/home.html
          curl -s "${H[@]}" -H "X-PM-Gate: $KEY" "http://127.0.0.1:8090/wp-json/pm/v1/products?brand=fixnote" | grep -q '\[TEST\] Fixnote'
          if grep -iE "PHP (Fatal|Parse|Warning|Notice|Deprecated).*(perfumarathi-shop|pm-staging-guard)" /tmp/php.log; then exit 1; fi
          echo "Gate verified"
      - name: Secrets were not written to disk outside wp-config.php
        run: |
          grep -rl --exclude=wp-config.php "$DBP" "$HOME/perfume.nokkoo.in" && { echo "DB password leaked into files"; exit 1; } || true
          test "$(stat -c %a "$HOME/perfume.nokkoo.in/wp-config.php")" = 600
          if grep -q "$DBP" /tmp/install.log; then echo "password printed in output"; exit 1; fi
      - name: Brand homepage setup (refuses non-staging, then live design + shop on the homepage)
        run: |
          D="$HOME/perfume.nokkoo.in"
          if DOCROOT=/tmp DOCROOT_NOTE=x bash server/setup-brand-home.sh; then echo "should refuse non-staging"; exit 1; fi
          # Stand-in for the three public media files (CI never contacts the live site).
          mkdir -p /tmp/assets && cd /tmp/assets
          printf '\x89PNG\r\n\x1a\nfake' > IMG_2610.png; printf '\xff\xd8\xff fake' > IMG_2609.jpg; head -c 4096 /dev/urandom > IMG_2654.mp4
          php -S 127.0.0.1:8095 -t /tmp/assets >/tmp/assets.log 2>&1 &
          sleep 1; cd "$GITHUB_WORKSPACE"
          PM_ASSET_SRC=http://127.0.0.1:8095 bash server/setup-brand-home.sh | tee /tmp/brand.log
          PM_ASSET_SRC=http://127.0.0.1:8095 bash server/setup-brand-home.sh >/dev/null   # idempotent second run
          for f in IMG_2610.png IMG_2609.jpg IMG_2654.mp4; do test -s "$D/wp-content/uploads/pm-brand/$f"; done
          test ! -e "$D/wp-content/plugins/perfumarathi-shop.old" && test ! -e "$D/wp-content/plugins/perfumarathi-shop.new"
          KEY=$(grep -oE 'Staging key \(visitors\):\s+[0-9a-f]+' /tmp/install.log | awk '{print $NF}')
          php -S 127.0.0.1:8092 -t "$D" /tmp/router.php >/tmp/php3.log 2>&1 &
          sleep 2
          curl -s -H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https' -H "X-PM-Gate: $KEY" http://127.0.0.1:8092/ > /tmp/front.html
          for want in 'id="pf-brand-home"' 'THE ART OF FRAGRANCE' 'uploads/pm-brand/IMG_2654.mp4' 'uploads/pm-brand/IMG_2610.png' \
                      'uploads/pm-brand/IMG_2609.jpg' 'SHOP PERFUMARATHI' 'SHOP FIXNOTE' '/shop-perfumarathi/' '/shop-fixnote/' \
                      'class="pm-home"' 'data-pm-rail' 'FOLLOW PERFUMARATHI' 'wa.me/971528209716' 'data-pm-open-cart' 'pm-canvas' 'noindex'; do
            grep -qF "$want" /tmp/front.html || { echo "missing on homepage: $want"; exit 1; }
          done
          # Social section must come AFTER the shop sections, and no theme header/footer (canvas template).
          a=$(grep -bo 'class="pm-home"' /tmp/front.html | head -1 | cut -d: -f1); b=$(grep -bo 'FOLLOW PERFUMARATHI' /tmp/front.html | cut -d: -f1)
          test "$a" -lt "$b"
          if grep -qE '<div class="wp-site-blocks"|<header class="wp-block-template-part|<footer class="wp-block-template-part' /tmp/front.html; then echo "theme header/footer rendered"; exit 1; fi
          if grep -q 'perfumarathi.com/?page_id' /tmp/front.html; then echo "links point at live site"; exit 1; fi
          # Exactly one button per brand: SHOP PERFUMARATHI and SHOP FIXNOTE (no ENTER buttons, no extra button row).
          for bad in 'ENTER PERFUMARATHI' 'ENTER FIXNOTE' 'pm-home__cta' 'pf-shop'; do
            if grep -qF "$bad" /tmp/front.html; then echo "homepage still has: $bad"; exit 1; fi
          done
          test "$(grep -o 'aria-label="Shop Perfumarathi"' /tmp/front.html | wc -l)" = 1
          test "$(grep -o 'aria-label="Shop Fixnote"' /tmp/front.html | wc -l)" = 1
          test "$(grep -o 'class="pf-enter"' /tmp/front.html | wc -l)" = 2
          if grep -iE "PHP (Fatal|Parse|Warning|Notice|Deprecated).*(perfumarathi-shop|pm-staging-guard)" /tmp/php3.log; then exit 1; fi
          echo "Brand homepage verified"
      - name: Collection shop (theme header/footer, 15 products from the page, product pages, prices)
        run: |
          set -o pipefail
          D="$HOME/perfume.nokkoo.in"
          W="php $HOME/.wp-cli/pm-staging-wp-cli.phar --path=$D"
          if DOCROOT=/tmp bash server/setup-collection.sh; then echo "should refuse non-staging"; exit 1; fi
          # Stand-in for perfumarathi.com/pm-page-new: same markup, small generated JPEGs (CI never contacts the live site).
          mkdir -p /tmp/fixture/pm-page-new
          php -r '
            $names = ["Perfumarathi signature","2 PCS Combo","3 PCS Combo","4 PCS Combo","Kausar","Oud Al Rizq","Hubb Al Hayatt","Zayrah","Fruity Crunch","Umm Al Mymuna","Inspired Man","Ayrin","Mahar","Emarathi Edition","Miskeen","Ruh"];
            $h = "<html><body><section class=\"feedback\"><div class=\"feedback-track\">";
            for ($r = 0; $r < 2; $r++) {
              $h .= "<div class=\"feedback-card\"><strong>Kausar</strong><div class=\"reviewer\">Rohit Verma</div><div class=\"stars\">★★★★★</div><p>“Fresh &amp; classy 👌”</p></div>";
              $h .= "<div class=\"feedback-card\"><strong>Hubb Al Hayat</strong><div class=\"reviewer\">Sameer Khan</div><div class=\"stars\">★★★★★</div><p>“Second time ordering this one 😍”</p></div>";
            }
            $h .= "</div></section>";
            foreach ($names as $i => $n) {
              $im = imagecreatetruecolor(320, 320); imagefill($im, 0, 0, imagecolorallocate($im, 40 + $i * 10, 80, 120));
              ob_start(); imagejpeg($im, null, 80); $b = base64_encode(ob_get_clean());
              $h .= "<div class=\"product\"><img decoding=\"async\" alt=\"$n\" loading=\"lazy\" src=\"data:image/jpeg;base64,$b\"/><h3>$n</h3></div>";
            }
            file_put_contents("/tmp/fixture/pm-page-new/index.html", $h . "</body></html>");'
          php -S 127.0.0.1:8096 -t /tmp/fixture >/tmp/fixture.log 2>&1 &
          sleep 1
          PM_COLLECTION_SRC=http://127.0.0.1:8096/pm-page-new/ bash server/setup-collection.sh | tee /tmp/coll.log
          PM_COLLECTION_SRC=http://127.0.0.1:8096/pm-page-new/ bash server/setup-collection.sh > /tmp/coll2.log   # idempotent
          grep -q "exists: Kausar" /tmp/coll2.log
          test "$($W theme list --status=active --field=name)" = "perfumarathi"
          $W eval-file - <<'PHP'
          <?php
          $f = function ( $m ) { WP_CLI::error( $m ); };
          $q = new WP_Query( array( 'post_type' => 'product', 'post_status' => 'publish', 'posts_per_page' => -1, 'fields' => 'ids',
            'tax_query' => array( array( 'taxonomy' => 'pm_brand', 'field' => 'slug', 'terms' => 'perfumarathi' ) ) ) );
          if ( 15 !== count( $q->posts ) ) $f( 'expected 15 published Perfumarathi products, got ' . count( $q->posts ) );
          $k = wc_get_product( get_page_by_path( 'kausar', OBJECT, 'product' ) );
          if ( ! $k || ! $k->get_image_id() ) $f( 'Kausar missing or has no image' );
          if ( 'Saffron, Jasmine' !== get_post_meta( $k->get_id(), '_pm_notes_top', true ) ) $f( 'Kausar notes' );
          if ( '' !== (string) $k->get_price() ) $f( 'a price was invented' );
          if ( 1 !== (int) $k->get_review_count() ) $f( 'Kausar should have exactly 1 review (duplicates on page), has ' . $k->get_review_count() );
          $h = wc_get_product( get_page_by_path( 'hubb-al-hayatt', OBJECT, 'product' ) );
          if ( 1 !== (int) $h->get_review_count() ) $f( 'alias Hubb Al Hayat -> Hubb Al Hayatt review missing' );
          $c = get_page_by_path( '4-pcs-combo', OBJECT, 'product' );
          if ( 4 !== count( array_filter( explode( ',', (string) get_post_meta( $c->ID, '_pm_fbt_ids', true ) ) ) ) ) $f( '4 PCS combo items' );
          if ( ! has_term( 'combos', 'product_cat', $c->ID ) ) $f( 'combo category' );
          if ( ! has_term( 'mens-perfumes', 'product_cat', get_page_by_path( 'inspired-man', OBJECT, 'product' ) ) ) $f( "Inspired Man not in Men's" );
          if ( ! get_option( 'pm_collection_hero_perfumarathi' ) ) $f( 'hero image' );
          $t = get_posts( array( 'post_type' => 'product', 'post_status' => 'publish', 's' => '[TEST]', 'numberposts' => 5 ) );
          if ( $t ) $f( '[TEST] products still published' );
          WP_CLI::success( 'Collection data verified' );
          PHP
          KEY=$(grep -oE 'Staging key \(visitors\):\s+[0-9a-f]+' /tmp/install.log | awk '{print $NF}')
          php -S 127.0.0.1:8097 -t "$D" /tmp/router.php >/tmp/php4.log 2>&1 &
          sleep 2
          get() { curl -s -H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https' -H "X-PM-Gate: $KEY" "http://127.0.0.1:8097$1"; }
          need() { grep -qF -- "$2" "$1" || { echo "missing in $1: $2"; exit 1; }; }
          # Shop Perfumarathi = product list only (no hero, feedback, offers).
          get /shop-perfumarathi/ > /tmp/shop.html
          for w in 'class="pmt-brand-main">PERFUMARATHI' 'class="pm-shop" data-brand="perfumarathi"' 'pm-search' 'pm-sort' 'Delivery Across' 'pmt-sticky'; do need /tmp/shop.html "$w"; done
          for bad in 'Find Your Perfumarathi' 'pmc-wordmark' 'pmc-fb-card' 'SPECIAL PERFUME OFFER' 'Choose Your Combo'; do
            if grep -qF "$bad" /tmp/shop.html; then echo "shop page still shows: $bad"; exit 1; fi
          done
          json() { php -r '$d = json_decode( stream_get_contents( STDIN ), true ); '"$1"; }
          get '/wp-json/pm/v1/products?brand=perfumarathi&per_page=48' > /tmp/list.json
          json 'if ( 15 !== count( $d["items"] ) ) { fwrite( STDERR, "expected 15 products\n" ); exit( 1 ); }
                foreach ( $d["items"] as $i ) { if ( $i["priced"] || ! $i["in_stock"] || false !== strpos( $i["name"], "[TEST]" ) ) { fwrite( STDERR, "bad item " . $i["name"] . "\n" ); exit( 1 ); } }' < /tmp/list.json
          get /product/kausar/ > /tmp/kausar.html
          for w in 'pmt-brand-main' 'Delivery Across' 'Saffron, Jasmine' 'Fir Resin, Cedar Hard Wood' 'A Fragrance of Divine Elegance' 'Price on request' 'pm-enquire' 'woocommerce-product-gallery'; do need /tmp/kausar.html "$w"; done
          if grep -qE 'single_add_to_cart_button|pm_buy_now' /tmp/kausar.html; then echo "add to cart / buy now without a price"; exit 1; fi
          get /product/3-pcs-combo/ > /tmp/combo.html
          need /tmp/combo.html 'class="pm-fbt"'
          KID=$($W eval 'echo get_page_by_path( "kausar", OBJECT, "product" )->ID;')
          # Owner sets a price -> Add to Cart + Buy Now on the product page, priced + purchasable in the list.
          $W eval '$p = wc_get_product( get_page_by_path( "kausar", OBJECT, "product" ) ); $p->set_regular_price( "150" ); $p->save();'
          get /product/kausar/ > /tmp/kausar2.html
          need /tmp/kausar2.html 'single_add_to_cart_button'
          need /tmp/kausar2.html "name=\"pm_buy_now\" value=\"$KID\""
          get '/wp-json/pm/v1/products?brand=perfumarathi&per_page=48' | json '$k = array_values( array_filter( $d["items"], function ( $i ) { return "Kausar" === $i["name"]; } ) );
                if ( ! $k || ! $k[0]["priced"] || ! $k[0]["purchasable"] || ! $k[0]["simple"] ) { fwrite( STDERR, "Kausar not buyable in list\n" ); exit( 1 ); }'
          # Buy Now (form posts pm_buy_now only, like the button): goes to checkout with 2 x Kausar in the cart.
          H=(-H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https' -H "X-PM-Gate: $KEY")
          # The site thinks it is HTTPS (X-Forwarded-Proto), so the cart cookie is Secure, and curl will not store a Secure
          # cookie for the custom Host over plain HTTP. Test-only: copy the Set-Cookie values into a Cookie header ourselves.
          loc=$(curl -s -o /dev/null -D /tmp/buy.hdr -w '%{redirect_url}' "${H[@]}" -d "pm_buy_now=$KID&quantity=2" http://127.0.0.1:8097/product/kausar/)
          case "$loc" in */checkout/*) ;; *) echo "Buy Now redirected to '$loc', expected checkout"; exit 1;; esac
          CK=$(grep -i '^set-cookie:' /tmp/buy.hdr | sed -E 's/^[Ss]et-[Cc]ookie: *([^;]*).*/\1/' | tr -d '\r' | paste -sd ';' -)
          echo "$CK" | grep -q 'wp_woocommerce_session_' || { echo "Buy Now did not start a cart session"; cat /tmp/buy.hdr; exit 1; }
          curl -s -D /tmp/checkout.hdr "${H[@]}" -H "Cookie: $CK" http://127.0.0.1:8097/checkout/ > /tmp/checkout.html
          if ! grep -q 'billing_first_name' /tmp/checkout.html; then
            echo "--- checkout headers"; cat /tmp/checkout.hdr
            echo "--- checkout body"; head -c 1500 /tmp/checkout.html; exit 1
          fi
          tr -d '\n\t' < /tmp/checkout.html | grep -qE 'Kausar.{0,300}product-quantity[^>]*>[^0-9<]*2<' || { echo "checkout does not show 2 x Kausar"; exit 1; }
          # Stock & Prices admin page: validation, saving, permissions.
          $W --user=pmadmin eval-file - <<'PHP'
          <?php
          $f   = function ( $m ) { WP_CLI::error( $m ); };
          $id  = function ( $s ) { return get_page_by_path( $s, OBJECT, 'product' )->ID; };
          list( $n, $err ) = PM_Stock::apply_rows( array(
            $id( 'mahar' ) => array( 'regular' => '120', 'sale' => '99.50', 'qty' => '5', 'status' => 'instock' ),
            $id( 'ruh' )   => array( 'regular' => '-3', 'sale' => '', 'qty' => '', 'status' => 'instock' ),
            $id( 'ayrin' ) => array( 'regular' => '80', 'sale' => '90', 'qty' => 'abc', 'status' => 'instock' ),
            $id( 'zayrah' ) => array( 'regular' => '110', 'sale' => '120', 'qty' => '', 'status' => 'outofstock' ),
          ) );
          $m = wc_get_product( $id( 'mahar' ) );
          if ( '120' !== $m->get_regular_price() || '99.50' !== $m->get_sale_price() || 5 !== (int) $m->get_stock_quantity() || ! $m->get_manage_stock() ) $f( 'Mahar not saved' );
          if ( '' !== wc_get_product( $id( 'ruh' ) )->get_regular_price() ) $f( 'negative price saved' );
          if ( '' !== wc_get_product( $id( 'ayrin' ) )->get_regular_price() ) $f( 'row with bad stock saved' );
          $z = wc_get_product( $id( 'zayrah' ) );
          if ( '110' !== $z->get_regular_price() || '' !== $z->get_sale_price() || 'outofstock' !== $z->get_stock_status() ) $f( 'Zayrah: sale >= regular must be dropped, status saved' );
          // Ruh: bad price; Ayrin: sale >= regular AND bad stock (both reported, row not saved); Zayrah: sale >= regular.
          if ( 2 !== $n || 4 !== count( $err ) ) $f( "expected 2 updated / 4 errors, got $n / " . count( $err ) . ': ' . implode( ' | ', $err ) );
          list( $n2 ) = PM_Stock::apply_rows( array( $id( 'mahar' ) => array( 'regular' => '120', 'sale' => '99.50', 'qty' => '5', 'status' => 'instock' ) ) );
          if ( 0 !== $n2 ) $f( 'unchanged row counted as update' );
          PM_Stock::apply_rows( array( $id( 'mahar' ) => array( 'regular' => '120', 'sale' => '99.50', 'qty' => '0', 'status' => 'instock' ) ) );
          if ( 'outofstock' !== wc_get_product( $id( 'mahar' ) )->get_stock_status() ) $f( 'qty 0 must be out of stock' );
          ob_start(); PM_Stock::page(); $html = ob_get_clean();
          foreach ( array( 'Stock &amp; Prices', 'Kausar', 'pm_stock_nonce', 'rows[' . $id( 'kausar' ) . '][regular]' ) as $w ) if ( false === strpos( $html, $w ) ) $f( "page missing $w" );
          wp_set_current_user( 0 );
          list( $n3, $e3 ) = PM_Stock::apply_rows( array( $id( 'ruh' ) => array( 'regular' => '1' ) ) );
          if ( 0 !== $n3 || '' !== wc_get_product( $id( 'ruh' ) )->get_regular_price() ) $f( 'anonymous user could change prices' );
          WP_CLI::success( 'Stock & Prices verified' );
          PHP
          get '/product/zayrah/' > /tmp/zayrah.html; need /tmp/zayrah.html 'Out of stock'
          if grep -q 'pm_buy_now' /tmp/zayrah.html; then echo "buy now on out-of-stock product"; exit 1; fi
          # Anonymous POST to the save handler is refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -d "action=pm_stock_save&rows[$KID][regular]=1" http://127.0.0.1:8097/wp-admin/admin-post.php)
          case "$code" in 400|403) ;; *) echo "anonymous save returned $code"; exit 1;; esac
          test "$($W eval 'echo wc_get_product( get_page_by_path( "kausar", OBJECT, "product" ) )->get_regular_price();')" = 150
          get /cart/ > /tmp/cart.html; need /tmp/cart.html 'pmt-brand-main'; need /tmp/cart.html 'Delivery Across'
          get / > /tmp/front2.html; need /tmp/front2.html 'id="pf-brand-home"'
          if grep -q 'pmt-brand-main' /tmp/front2.html; then echo "brand homepage got the theme header"; exit 1; fi
          for l in /tmp/php4.log; do if grep -iE "PHP (Fatal|Parse|Warning|Notice|Deprecated).*(perfumarathi)" "$l"; then exit 1; fi; done
          echo "Collection shop verified"
      - name: Payments (COD on, Stripe in TEST mode, live keys refused, webhook through the staging lock)
        run: |
          set -o pipefail
          D="$HOME/perfume.nokkoo.in"
          W="php $HOME/.wp-cli/pm-staging-wp-cli.phar --path=$D"
          export GUARD_URL="file://$GITHUB_WORKSPACE/server/mu-plugins/pm-staging-guard.php"
          if DOCROOT=/tmp bash server/setup-payments.sh < /dev/null; then echo "should refuse non-staging"; exit 1; fi
          # Dummy live-format keys, assembled at runtime so the repo's secret scanner stays strict.
          if printf 'pk_%s_abc\nsk_%s_def\n' live live | bash server/setup-payments.sh > /tmp/pay0.log 2>&1; then echo "live keys accepted"; exit 1; fi
          grep -q "LIVE key" /tmp/pay0.log
          printf '\n' | bash server/setup-payments.sh | tee /tmp/pay1.log
          $W eval-file - <<'PHP'
          <?php
          $f = function ( $m ) { WP_CLI::error( $m ); };
          if ( ! is_plugin_active( 'woocommerce-gateway-stripe/woocommerce-gateway-stripe.php' ) ) $f( 'Stripe plugin not active' );
          $s = get_option( 'woocommerce_stripe_settings' );
          if ( 'yes' !== ( $s['testmode'] ?? '' ) ) $f( 'Stripe not in test mode' );
          if ( 'yes' === ( $s['enabled'] ?? '' ) ) $f( 'Stripe enabled without keys' );
          foreach ( (array) $s as $v ) if ( is_string( $v ) && false !== strpos( $v, '_live_' ) ) $f( 'live key stored' );
          $gw = WC()->payment_gateways()->payment_gateways();
          if ( empty( $gw['stripe'] ) ) $f( 'stripe gateway not registered' );
          if ( 'yes' !== $gw['cod']->enabled ) $f( 'COD off' );
          WP_CLI::success( 'Payments without keys verified' );
          PHP
          printf 'pk_test_ci123\nsk_test_ci456\n' | bash server/setup-payments.sh > /tmp/pay2.log 2>&1
          if grep -q 'sk_test_ci456' /tmp/pay2.log; then echo "secret key printed"; exit 1; fi
          grep -q 'already installed' /tmp/pay2.log
          $W eval 'WC()->payment_gateways(); $s = get_option( "woocommerce_stripe_settings" ); exit( ( "yes" === $s["enabled"] && "pk_test_ci123" === $s["test_publishable_key"] && "sk_test_ci456" === $s["test_secret_key"] && "yes" === $s["testmode"] ) ? 0 : 1 );'
          if printf 'pk_test_ok\nsk_bad\n' | bash server/setup-payments.sh > /dev/null 2>&1; then echo "bad secret key accepted"; exit 1; fi
          grep -q 'pm_staging_gate_webhooks' "$D/wp-content/mu-plugins/pm-staging-guard.php"
          php -S 127.0.0.1:8098 -t "$D" /tmp/router.php >/tmp/php5.log 2>&1 &
          sleep 2
          H=(-H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https')
          code=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -X POST -d '{}' 'http://127.0.0.1:8098/?wc-api=wc_stripe')
          test "$code" != 401 || { echo "Stripe webhook blocked by the staging lock"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" 'http://127.0.0.1:8098/?wc-api=something_else')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" 'http://127.0.0.1:8098/')" = 401
          if grep -iE "PHP (Fatal|Parse|Warning|Notice|Deprecated).*(perfumarathi|pm-staging-guard)" /tmp/php5.log; then exit 1; fi
          echo "Payments verified"
      - name: Rotate secrets (wrong DB password refused, then new key, admin password and DB password)
        run: |
          set -o pipefail
          D="$HOME/perfume.nokkoo.in"
          OLDKEY=$(grep -oE 'Staging key \(visitors\):\s+[0-9a-f]+' /tmp/install.log | awk '{print $NF}')
          NEWDB='ci-New-db-2'
          sudo mysql -uroot -proot -e "ALTER USER 'uddjzwrz_perfume'@'localhost' IDENTIFIED BY '$NEWDB';"
          cp "$D/wp-config.php" /tmp/cfg.before
          if printf 'y\nnot-the-password\n' | bash server/rotate-staging-secrets.sh; then echo "should refuse"; exit 1; fi
          cmp "$D/wp-config.php" /tmp/cfg.before
          printf 'y\n%s\n' "$NEWDB" | bash server/rotate-staging-secrets.sh 2>&1 | tee /tmp/rotate.log
          if grep -q "$NEWDB" /tmp/rotate.log; then echo "DB password printed"; exit 1; fi
          grep -q "define( 'DB_PASSWORD', '$NEWDB' );" "$D/wp-config.php"
          test "$(stat -c %a "$D/wp-config.php")" = 600
          test ! -e "$D/wp-config.php.bak"
          NEWKEY=$(grep -oE 'New staging key \(visitors\):\s+[0-9a-f]+' /tmp/rotate.log | awk '{print $NF}')
          NEWADMIN=$(grep -oE 'New admin password \(pmadmin\):\s+\S+' /tmp/rotate.log | awk '{print $NF}')
          test -n "$NEWKEY" && test "$NEWKEY" != "$OLDKEY" && test -n "$NEWADMIN"
          php "$HOME/.wp-cli/pm-staging-wp-cli.phar" --path="$D" eval "exit( wp_check_password( '$NEWADMIN', get_user_by( 'login', 'pmadmin' )->user_pass ) ? 0 : 1 );"
          php -S 127.0.0.1:8091 -t "$D" /tmp/router.php >/tmp/php2.log 2>&1 &
          sleep 2
          H=(-H 'Host: perfume.nokkoo.in' -H 'X-Forwarded-Proto: https')
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: $OLDKEY" http://127.0.0.1:8091/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "X-PM-Gate: $NEWKEY" http://127.0.0.1:8091/)" = 200
          # Refuses a folder that is not the staging site
          mkdir -p /tmp/notstaging && echo "<?php define( 'DB_PASSWORD', 'x' );" > /tmp/notstaging/wp-config.php
          if printf 'n\n' | DOCROOT=/tmp/notstaging bash server/rotate-staging-secrets.sh; then echo "should refuse"; exit 1; fi
          echo "Rotation verified"
