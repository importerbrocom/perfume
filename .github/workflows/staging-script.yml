          php "$HOME/.wp-cli/pm-staging-wp-cli.phar" --path="$D" option get siteurl | grep -q perfume.nokkoo.in
          php "$HOME/.wp-cli/pm-staging-wp-cli.phar" --path="$D" post list --post_type=product --format=count | grep -qE '^1[5-9]|^[2-9][0-9]'
          if crontab -l 2>/dev/null | grep -q pmshop-scheduler; then echo "cron should be removed"; exit 1; fi
          sleep 1
          printf 'y\n' | env SCHEME=http HEALTH_URL=$U/up bash "$A/platform.sh" publish
          test ! -e "$D/wp-config.php" && test -f "$D/index.php" && test -L "$D/storage"
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/up)" = 200
          crontab -l | grep -q pmshop-scheduler
          test "$(cat "$HOME/perfumarathi.com/index.php")" = "LIVE"
          echo "Shop installer verified"

