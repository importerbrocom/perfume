          env RELEASE_FILE=/tmp/rel2/pmshop.tar.gz SCHEME=http HEALTH_URL=$U/up bash "$A/platform.sh" update | grep -q 'Already on the newest'
          printf 'y\n' | env SCHEME=http HEALTH_URL=$U/up bash "$A/platform.sh" rollback
          test "$(basename "$(readlink "$A/current")")" = 20260101-000000-ci000001
          test "$(code -H "X-Shop-Gate: $KEY" $U/api/products/kausar)" = 200
          bash "$A/platform.sh" open
