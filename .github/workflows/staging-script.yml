          (cd "$A/current" && MP="$MP" php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $m = config("mail.mailers.smtp"); exit(config("mail.default") === "smtp" && $m["host"] === "mail.example.test" && (int) $m["port"] === 587 && $m["password"] === getenv("MP") && config("database.connections.mysql.password") === getenv("SHOPP") ? 0 : 1);')
      - name: Put WordPress back, then switch to the shop again
