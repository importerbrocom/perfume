          grep -q "15 created" /tmp/shop-install.log
      - name: Verify the installed shop (files, secrets, preview lock, products, photos, admin login)
        run: |
          set -o pipefail
          D="$HOME/perfume.nokkoo.in"; A="$HOME/pmshop"; U=http://127.0.0.1:8092
          # Web folder: only the shop's public files + the cPanel files; WordPress moved to a backup
          test ! -e "$D/wp-config.php" && test ! -e "$D/.env"
          for f in index.php .htaccess assets favicon.ico .well-known php.ini .user.ini; do test -e "$D/$f"; done
          test -L "$D/storage" && test "$(readlink "$D/storage")" = "$A/shared/storage/app/public"
          grep -q "$A/current" "$D/index.php"
          BK=$(ls -d "$HOME"/pm-wordpress-backup-* | tail -1)
          test -f "$BK/files/wp-config.php" && test -d "$BK/files/wp-content" && test -s "$BK/wordpress-db.sql.gz"
          test "$(cat "$HOME/perfumarathi.com/index.php")" = "LIVE" && test "$(ls -A "$HOME/perfumarathi.com")" = "index.php"
          # Secrets: .env only in the app folder, mode 600, password kept exactly
          test "$(stat -c %a "$A/shared/.env")" = 600
          test -z "$(grep -rlF "$SHOPP" "$D" 2>/dev/null)"
          (cd "$A/current" && php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); exit(config("database.connections.mysql.password") === getenv("SHOPP") ? 0 : 1);')
          grep -q '^APP_DEBUG=false' "$A/shared/.env" && grep -q '^APP_ENV=production' "$A/shared/.env"
          KEY=$(grep -oE 'Preview key[^:]*:\s+[0-9a-f]+' /tmp/shop-install.log | awk '{print $NF}')
          PASS=$(grep -oE 'Password:\s+\S+' /tmp/shop-install.log | awk '{print $NF}')
          test -n "$KEY" && test -n "$PASS"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code $U/up)" = 200
          test "$(code $U/)" = 401                                  # preview lock
          test "$(code $U/api/products)" = 401
          test "$(code -H "X-Shop-Gate: $KEY" $U/)" = 200
          curl -s -H "X-Shop-Gate: $KEY" $U/shop-fixnote | grep -q '<div id="root">'
          N=$(curl -s -H "X-Shop-Gate: $KEY" "$U/api/products?per_page=48" | php -r 'echo json_decode(stream_get_contents(STDIN), true)["meta"]["total"];')
          test "$N" = 15
          IMG=$(curl -s -H "X-Shop-Gate: $KEY" $U/api/products/kausar | php -r '$d = json_decode(stream_get_contents(STDIN), true); echo parse_url($d["product"]["images"][0]["url"] ?? "", PHP_URL_PATH);')
          test -n "$IMG" && test "$(code "$U$IMG")" = 200           # uploaded photos served through the storage link
          ASSET=$(ls "$D/assets" | grep -m1 '^index-.*\.js$'); test "$(code "$U/assets/$ASSET")" = 200
          for p in /.env /.htaccess; do test "$(code -H "X-Shop-Gate: $KEY" $U$p)" = 403; done
          if curl -s -H "X-Shop-Gate: $KEY" $U/vendor/autoload.php | grep -q '<?php'; then echo "code readable"; exit 1; fi
          test "$(code $U/admin)" = 200                             # admin login page is outside the lock
          # Admin login (Sanctum session + CSRF) with the printed password
          J=/tmp/jar; rm -f $J
          curl -s -c $J -b $J $U/sanctum/csrf-cookie -o /dev/null
          X=$(awk '$6 == "XSRF-TOKEN" {print $7}' $J | php -r 'echo urldecode(trim(stream_get_contents(STDIN)));')
          curl -s -c $J -b $J -H "X-XSRF-TOKEN: $X" -H "Referer: $U/admin" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d "{\"email\":\"owner@example.test\",\"password\":\"$PASS\"}" $U/api/admin/login | grep -q '"role":"admin"'
          curl -s -c $J -b $J -H "Referer: $U/admin" -H 'Accept: application/json' $U/api/admin/dashboard | php -r '$d = json_decode(stream_get_contents(STDIN), true); exit(($d["products_total"] ?? 0) === 15 ? 0 : 1);'
          crontab -l | grep -q 'pmshop-scheduler'
          (cd "$A/current" && php artisan schedule:run | grep -qi 'running\|no scheduled')
          bash "$A/platform.sh" status | tee /tmp/status.txt; grep -q 'private' /tmp/status.txt
          # A second install is refused
          if printf '\n\n%s\nx@example.test\nn\n' "$SHOPP" | env $PM_ENV bash server/platform.sh install; then echo "should refuse"; exit 1; fi
      - name: Update to a new release, roll back, open and lock
