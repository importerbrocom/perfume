# Local staging only. Usage: cd dev && cp .env.dev.example .env && docker compose up -d && ./setup.sh
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      WP_ENVIRONMENT_TYPE: staging
    volumes:
      - wpdata:/var/www/html
      - ../wp-content/plugins/perfumarathi-shop:/var/www/html/wp-content/plugins/perfumarathi-shop
  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on: [wordpress]
    volumes:
      - wpdata:/var/www/html
      - ../wp-content/plugins/perfumarathi-shop:/var/www/html/wp-content/plugins/perfumarathi-shop
      - ./seed-staging.php:/seed-staging.php:ro
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WP_ENVIRONMENT_TYPE: staging
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    entrypoint: ["wp"]
    profiles: [tools]
volumes: {dbdata: {}, wpdata: {}}
